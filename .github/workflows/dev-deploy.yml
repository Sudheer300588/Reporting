name: Deploy to VPS (Reporting App)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "➡ Moving to project folder"
            cd ~/htdocs/dev.hcdteam.com/Reporting

            echo "⬇ Pull latest code"
            git fetch origin
            git reset --hard origin/main

            # =========================
            # LOAD NVM
            # =========================
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # =========================
            # BACKEND SETUP (Node 18)
            # =========================
            echo "🔧 Backend setup"
            cd backend
            nvm use 18 || nvm install 18

            rm -rf node_modules package-lock.json
            npm install

            npx prisma generate

            # check .env exists
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file missing"
              exit 1
            fi

            # =========================
            # FRONTEND BUILD (Node 20)
            # =========================
            echo "🎨 Frontend build"
            cd ../frontend
            nvm use 20 || nvm install 20

            rm -rf node_modules package-lock.json
            npm install
            npm run build

            # =========================
            # MOVE BUILD TO BACKEND
            # =========================
            echo "📦 Moving build"
            rm -rf ../backend/dist
            mv dist ../backend/dist

            # =========================
            # PM2 SETUP & RESTART
            # =========================
            echo "🚀 Starting backend"
            cd ../backend
            nvm use 18

            # ensure pm2 installed
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2

            # ensure pm2 path
            export PATH=$PATH:$(npm bin -g)

            # start or reload safely
            if pm2 describe hc-development > /dev/null; then
              echo "🔄 Reloading app"
              pm2 reload ecosystem.config.cjs || pm2 restart ecosystem.config.cjs
            else
              echo "🆕 Starting app"
              pm2 start ecosystem.config.cjs
            fi

            # save process list
            pm2 save

            # =========================
            # HEALTH CHECK
            # =========================
            echo "🔍 Checking app status"
            pm2 status

            echo "📜 Last logs"
            pm2 logs hc-development --lines 20 --nostream

            echo "🌐 Checking server response"
            curl -f http://localhost:3000 || echo "⚠️ App might not be responding on port 3000"

            echo "✅ Deployment completed successfully"