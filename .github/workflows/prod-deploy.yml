name: Deploy to VPS (Production - Reporting App)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "➡ Moving to production folder"
            cd ~/htdocs/hcdteam.com/Reporting

            echo "⬇ Pull latest code"
            git fetch origin
            git reset --hard origin/main

            # =========================
            # LOAD NVM
            # =========================
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # =========================
            # BACKEND SETUP (Node 18)
            # =========================
            echo "🔧 Backend setup"
            cd backend
            nvm use 18 || nvm install 18

            rm -rf node_modules
            npm install

            npx prisma generate

            # ensure .env exists
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file missing"
              exit 1
            fi

            # =========================
            # FRONTEND BUILD (Node 20)
            # =========================
            echo "🎨 Frontend build"
            cd ../frontend
            nvm use 20 || nvm install 20

            rm -rf node_modules
            npm install
            npm run build

            # =========================
            # MOVE BUILD
            # =========================
            echo "📦 Moving build"
            rm -rf ../backend/dist
            mv dist ../backend/dist

            # =========================
            # PM2 RESTART (SAFE)
            # =========================
            echo "🚀 Starting backend"
            cd ../backend
            nvm use 18

            command -v pm2 >/dev/null 2>&1 || npm install -g pm2
            export PATH=$PATH:$(npm bin -g)

            if pm2 describe hc-development > /dev/null; then
              echo "🔄 Reloading app"
              pm2 reload ecosystem.config.cjs || pm2 restart ecosystem.config.cjs
            else
              echo "🆕 Starting app"
              pm2 start ecosystem.config.cjs
            fi

            pm2 save

            # =========================
            # HEALTH CHECK
            # =========================
            echo "🔍 Checking PM2 status"
            pm2 status

            echo "📜 Last logs"
            pm2 logs hc-development --lines 20 --nostream

            echo "🌐 Checking app response"
            curl -f --connect-timeout 5 --max-time 10 --retry 3 --retry-delay 2 http://localhost:3000 || (echo "❌ App not responding" && exit 1)

            echo "✅ Production Deployment Successful"